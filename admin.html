<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CPV ADMIN CHAT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: white;
    }

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .loginBox {
      width: 100%;
      max-width: 400px;
      background: #151515;
      padding: 30px;
      border-radius: 15px;
      border: 1px solid #333;
    }

    .loginBox h1 {
      text-align: center;
      color: red;
      margin-bottom: 25px;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    input {
      background: #222;
      color: white;
      border: 1px solid #444;
    }

    button {
      background: red;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #adminPage {
      display: none;
      min-height: 100vh;
    }

    .header {
      background: #111;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .header h2 {
      margin: 0;
      color: red;
      font-size: 20px;
    }

    .logout {
      width: auto;
      margin: 0;
      padding: 8px 14px;
      background: #333;
    }

    #guestList {
      padding: 10px;
    }

    .guest {
      background: #151515;
      border: 1px solid #333;
      padding: 15px;
      margin-bottom: 8px;
      border-radius: 10px;
      cursor: pointer;
    }

    .guest.unread {
      border-color: red;
      font-weight: bold;
    }

    .guestName {
      font-size: 17px;
    }

    .lastMessage {
      color: #aaa;
      margin-top: 5px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #conversation {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }

    .conversationHeader {
      background: #111;
      padding: 12px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .backButton {
      width: auto;
      margin: 0;
      padding: 8px 12px;
      background: #333;
    }

    .conversationTitle {
      flex: 1;
    }

    .conversationTitle strong {
      display: block;
      font-size: 17px;
    }

    .conversationTitle small {
      color: #888;
    }

    #messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      max-width: 80%;
      padding: 10px 12px;
      margin-bottom: 10px;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .guestMessage {
      background: #222;
      margin-right: auto;
    }

    .adminMessage {
      background: red;
      margin-left: auto;
    }

    .sender {
      font-size: 11px;
      opacity: .7;
      margin-bottom: 4px;
    }

    .time {
      font-size: 10px;
      opacity: .6;
      margin-top: 5px;
    }

    .message img {
      max-width: 100%;
      border-radius: 8px;
      display: block;
    }

    .replyArea {
      background: #111;
      padding: 10px;
      border-top: 1px solid #333;
      display: flex;
      gap: 8px;
    }

    #replyInput {
      flex: 1;
      margin: 0;
    }

    #sendButton,
    #imageButton {
      width: auto;
      margin: 0;
      padding: 12px 15px;
    }

    #imageButton {
      background: #333;
    }

    #imageInput {
      display: none;
    }

    #error {
      color: #ff5555;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginPage">
    <div class="loginBox">
      <h1>CPV ADMIN CHAT</h1>

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button id="loginButton">LOGIN</button>

      <div id="error"></div>
    </div>
  </div>


  <!-- ADMIN PAGE -->
  <div id="adminPage">

    <div class="header">
      <h2>CPV ADMIN CHAT</h2>
      <button class="logout" id="logoutButton">Logout</button>
    </div>

    <div id="guestList"></div>

  </div>


  <!-- CONVERSATION -->
  <div id="conversation">

    <div class="conversationHeader">

      <button class="backButton" id="backButton">
        ← Back
      </button>

      <div class="conversationTitle">
        <strong id="conversationGuestName">Guest</strong>
        <small id="conversationGuestId"></small>
      </div>

    </div>

    <div id="messages"></div>

    <div class="replyArea">

      <input
        type="text"
        id="replyInput"
        placeholder="Type a reply..."
      >

      <button id="imageButton">📷</button>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
      >

      <button id="sendButton">Send</button>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      push
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


    /* BUYER FIREBASE */

    const firebaseConfig = {
      apiKey: "AIzaSyBF1aJU4Os1R1QPVoaKSWHRNpQo7ZQ9FmU",
      authDomain: "cpv-client-01-sdk.firebaseapp.com",
      databaseURL: "https://cpv-client-01-sdk-default-rtdb.firebaseio.com",
      projectId: "cpv-client-01-sdk",
      storageBucket: "cpv-client-01-sdk.firebasestorage.app",
      messagingSenderId: "803696020930",
      appId: "1:803696020930:web:4733915e3caf24e6c25a5b"
    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);

    const auth = getAuth(app);


    let currentGuestId = null;
    let messagesListener = null;


    const loginPage = document.getElementById("loginPage");
    const adminPage = document.getElementById("adminPage");
    const conversation = document.getElementById("conversation");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");

    const guestList = document.getElementById("guestList");

    const backButton = document.getElementById("backButton");

    const messages = document.getElementById("messages");

    const replyInput = document.getElementById("replyInput");

    const sendButton = document.getElementById("sendButton");

    const imageButton = document.getElementById("imageButton");

    const imageInput = document.getElementById("imageInput");

    const errorBox = document.getElementById("error");


    /* LOGIN */

    loginButton.addEventListener("click", async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        errorBox.textContent = "Enter email and password.";
        return;
      }

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        errorBox.textContent = "";

      } catch (error) {

        errorBox.textContent = "Login failed: " + error.message;

      }

    });


    /* AUTH STATE */

    onAuthStateChanged(auth, user => {

      if (user) {

        loginPage.style.display = "none";

        adminPage.style.display = "block";

        conversation.style.display = "none";

        loadGuests();

      } else {

        loginPage.style.display = "flex";

        adminPage.style.display = "none";

        conversation.style.display = "none";

      }

    });


    /* LOGOUT */

    logoutButton.addEventListener("click", async () => {

      await signOut(auth);

    });


    /* LOAD GUESTS */

    function loadGuests() {

      const messagesRef = ref(db, "privateMessages");

      onValue(messagesRef, snapshot => {

        guestList.innerHTML = "";

        const data = snapshot.val();

        if (!data) {

          guestList.innerHTML =
            "<p style='text-align:center;color:#888;'>No guests yet.</p>";

          return;

        }


        const guests = [];


        Object.entries(data).forEach(([uid, conversationData]) => {

          const messageEntries =
            Object.entries(conversationData || {});

          if (messageEntries.length === 0) return;


          messageEntries.sort(
            (a, b) => (a[1].timestamp || 0) - (b[1].timestamp || 0)
          );


          const lastMessage =
            messageEntries[messageEntries.length - 1][1];


          guests.push({
            uid,
            name: lastMessage.name || "Guest",
            lastMessage
          });

        });


        guests.reverse();


        guests.forEach(guest => {

          const div = document.createElement("div");

          div.className = "guest";


          if (guest.lastMessage.sender !== "Admin") {

            div.classList.add("unread");

          }


          const preview =
            guest.lastMessage.text ||
            (guest.lastMessage.image ? "📷 Image" : "");


          div.innerHTML = `
            <div class="guestName">
              ${escapeHtml(guest.name)}
            </div>

            <div class="lastMessage">
              ${escapeHtml(preview)}
            </div>
          `;


          div.addEventListener("click", () => {

            openConversation(
              guest.uid,
              guest.name
            );

          });


          guestList.appendChild(div);

        });

      });

    }


    /* OPEN CONVERSATION */

    function openConversation(uid, name) {

      currentGuestId = uid;

      adminPage.style.display = "none";

      conversation.style.display = "flex";

      document.getElementById(
        "conversationGuestName"
      ).textContent = name || "Guest";

      document.getElementById(
        "conversationGuestId"
      ).textContent = "Guest ID: " + uid;


      if (messagesListener) {

        messagesListener();

      }


      const messagesRef =
        ref(db, "privateMessages/" + uid);


      messagesListener = onValue(
        messagesRef,
        snapshot => {

          messages.innerHTML = "";

          const data = snapshot.val();

          if (!data) return;


          Object.values(data).forEach(message => {

            const div =
              document.createElement("div");


            div.className =
              "message " +
              (
                message.sender === "Admin"
                  ? "adminMessage"
                  : "guestMessage"
              );


            const sender =
              document.createElement("div");

            sender.className = "sender";

            sender.textContent =
              message.sender || "Guest";


            div.appendChild(sender);


            if (message.text) {

              const text =
                document.createElement("div");

              text.textContent =
                message.text;

              div.appendChild(text);

            }


            if (message.image) {

              const img =
                document.createElement("img");

              img.src =
                message.image;

              div.appendChild(img);

            }


            const time =
              document.createElement("div");

            time.className = "time";

            time.textContent =
              formatTime(message.timestamp);

            div.appendChild(time);


            messages.appendChild(div);

          });


          messages.scrollTop =
            messages.scrollHeight;

        }
      );

    }


    /* BACK */

    backButton.addEventListener("click", () => {

      if (messagesListener) {

        messagesListener();

        messagesListener = null;

      }

      currentGuestId = null;

      conversation.style.display = "none";

      adminPage.style.display = "block";

    });


    /* SEND TEXT */

    sendButton.addEventListener("click", sendText);


    replyInput.addEventListener("keydown", event => {

      if (event.key === "Enter") {

        sendText();

      }

    });


    function sendText() {

      const text =
        replyInput.value.trim();

      if (!text || !currentGuestId) return;


      const messagesRef =
        ref(
          db,
          "privateMessages/" +
          currentGuestId
        );


      push(messagesRef, {

        sender: "Admin",

        text: text,

        timestamp: Date.now()

      });


      replyInput.value = "";

    }


    /* IMAGE BUTTON */

    imageButton.addEventListener("click", () => {

      imageInput.click();

    });


    imageInput.addEventListener("change", event => {

      const file =
        event.target.files[0];

      if (!file || !currentGuestId) return;


      const reader =
        new FileReader();


      reader.onload = function(e) {

        const img =
          new Image();


        img.onload = function() {

          const canvas =
            document.createElement("canvas");

          const maxSize = 600;


          let width = img.width;
          let height = img.height;


          if (width > height) {

            if (width > maxSize) {

              height =
                height * maxSize / width;

              width = maxSize;

            }

          } else {

            if (height > maxSize) {

              width =
                width * maxSize / height;

              height = maxSize;

            }

          }


          canvas.width = width;
          canvas.height = height;


          const ctx =
            canvas.getContext("2d");


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          const imageData =
            canvas.toDataURL(
              "image/jpeg",
              0.5
            );


          const messagesRef =
            ref(
              db,
              "privateMessages/" +
              currentGuestId
            );


          push(messagesRef, {

            sender: "Admin",

            image: imageData,

            timestamp: Date.now()

          });


          imageInput.value = "";

        };


        img.src = e.target.result;

      };


      reader.readAsDataURL(file);

    });


    /* HELPERS */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text || "";

      return div.innerHTML;

    }


    function formatTime(timestamp) {

      if (!timestamp) return "";

      return new Date(timestamp)
        .toLocaleString();

    }

  </script>

</body>
</html>
